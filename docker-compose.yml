services:
  ros_emotion:
    build:
      context: .
      dockerfile: Dockerfile  # Using the main Dockerfile
    container_name: ros_emotion_container
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./ros_emotion:/ros_ws/src/ros_emotion
    # Add a command to start the main ROS nodes including the node lifecycle manager
    command: >
      bash -c "
        source /opt/ros/$${ROS_DISTRO}/setup.bash &&
        source /ros_ws/install/setup.bash &&
        ros2 run ros_emotion node_lifecycle_manager.py &
        ros2 run ros_emotion emotional_state_manager.py &
        ros2 run ros_emotion llm_integration.py &
        ros2 run ros_emotion rumination_engine.py &
        ros2 run ros_emotion sensory_input_processor.py &
        ros2 run ros_emotion visualization_node.py &
        tail -f /dev/null
      "

  ros_emotion_test:
    build:
      context: .
      dockerfile: Dockerfile.test  # Using the test Dockerfile
    container_name: ros_emotion_test_container
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./ros_emotion:/ros_ws/src/ros_emotion

  web_interface:
    build:
      context: ./web_interface
      dockerfile: Dockerfile
    container_name: ros_web_interface_container
    restart: unless-stopped
    ports:
      - "9999:9999"
      - "9090:9090"
    volumes:
      - ./web_interface/web:/var/www/html
      - ./ros_emotion:/ros_ws/src/ros_emotion
    depends_on:
      - ros_emotion
    # Override the default command to make sure the entrypoint is called
    command: bash -c "tail -f /dev/null" 